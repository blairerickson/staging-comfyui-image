# PlaySpace staging ComfyUI — extra model paths
# Maps /root/models/* symlinks into ComfyUI's model search path.
# Actual models reside in /root/models/ at boot-time.
playground:
    base_path: /root/models/

    checkpoints: checkpoints/
    clip: clip/
    clip_vision: clip_vision/
    configs: configs/
    controlnet: controlnet/
    diffusion_models: diffusion_models/
    embeddings: embeddings/
    loras: loras/
    text_encoders: text_encoders/
    upscale_models: upscale_models/
    vae: vae/